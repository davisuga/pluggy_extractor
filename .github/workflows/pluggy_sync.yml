name: pluggy-sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
      PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
      PLUGGY_ITEM_IDS: ${{ secrets.PLUGGY_ITEM_IDS }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_PREFIX: ${{ secrets.S3_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache pluggy_sync binary
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: target/release/pluggy_sync
          key: pluggy-sync-bin-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'packages/api/src/**', 'pluggy_rust/src/**') }}

      - name: Install Rust
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: pluggy-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary if missing
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          cargo build -p api --bin pluggy_sync --locked --release

      - name: Run sync
        run: target/release/pluggy_sync

      - name: Update optional Google Drive snapshot
        if: vars.GOOGLE_DRIVE_ENABLED == 'true'
        env:
          GOOGLE_DRIVE_ENABLED: ${{ vars.GOOGLE_DRIVE_ENABLED }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        run: python3 scripts/drive_export.py
