name: pluggy-sync

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
      PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
      PLUGGY_ITEM_IDS: ${{ secrets.PLUGGY_ITEM_IDS }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_PREFIX: ${{ secrets.S3_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: pluggy-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache pluggy_sync binary
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: target/debug/pluggy_sync
          key: pluggy-sync-bin-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'packages/api/src/**', 'pluggy_rust/src/**') }}

      - name: Build binary if missing
        run: |
          if [ ! -x target/debug/pluggy_sync ]; then
            cargo build -p api --bin pluggy_sync --locked
          fi

      - name: Run sync
        run: target/debug/pluggy_sync
